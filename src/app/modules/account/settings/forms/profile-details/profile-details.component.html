<section class="card profile-details-card">
  <div class="card-header profile-card-header" role="button" data-bs-toggle="collapse"
    data-bs-target="#kt_account_profile_details" aria-expanded="true" aria-controls="kt_account_profile_details">
    <div class="profile-card-heading">
      <span class="profile-card-icon" aria-hidden="true">◎</span>
      <span>
        <span class="profile-card-title">{{ 'PROFILE_DETAILS' | translate }}</span>
        <span class="profile-card-subtitle">{{ 'USER_PROFILE' | translate }}</span>
      </span>
    </div>
    <span class="profile-card-chevron" aria-hidden="true"></span>
  </div>

  <div id="kt_account_profile_details" class="collapse show">
    <form [formGroup]="form" novalidate class="form" (ngSubmit)="saveSettings()">
      <div class="card-body profile-card-body">
        <div class="profile-avatar-row">
          <div class="profile-avatar-preview">
            <img *ngIf="user?.fileId == undefined" src="./assets/media/avatars/blank.png" alt="" />
            <img *ngIf="user?.fileId != undefined" [src]="user?.fileResult?.fileContents" alt="" />
          </div>
          <div class="profile-avatar-copy">
            <strong>{{ 'USER_PROFILE' | translate }}</strong>
            <span>300 × 300 px</span>
            <input type="file" class="profile-file-input" accept="image/*" (change)="onFileChange($event)" #fileUpload />
            <button type="button" class="btn btn-light-primary profile-upload-button" (click)="fileUpload.click()">
              <span [inlineSVG]="'./assets/media/icons/duotune/arrows/arr075.svg'" class="svg-icon svg-icon-4"></span>
              {{ user?.fileId == undefined ? ('UPLOAD' | translate) : ('CHANGE' | translate) }}
            </button>
          </div>
        </div>

        <div class="profile-fields-grid">
          <div class="profile-field">
            <label for="profile-first-name">{{ 'FIRST_NAME' | translate }} </label>
            <input id="profile-first-name" type="text" class="form-control" [placeholder]="'FIRST_NAME' | translate"
              name="name" formControlName="name"
              [class.is-invalid]="form.controls['name'].invalid && (form.controls['name'].dirty || form.controls['name'].touched)" />
            <ng-container [ngTemplateOutlet]="formError" [ngTemplateOutletContext]="{
              validation: 'required', message: ('FIRST_NAME' | translate) + ' ' + ('IS_REQUIRED' | translate), control: form.controls['name']
            }"></ng-container>
          </div>

          <div class="profile-field">
            <label for="profile-last-name">{{ 'LAST_NAME' | translate }}</label>
            <input id="profile-last-name" type="text" class="form-control" [placeholder]="'LAST_NAME' | translate"
              name="surname" formControlName="surname"
              [class.is-invalid]="form.controls['surname'].invalid && (form.controls['surname'].dirty || form.controls['surname'].touched)" />
            <ng-container [ngTemplateOutlet]="formError" [ngTemplateOutletContext]="{
              validation: 'required', message: ('LAST_NAME' | translate) + ' ' + ('IS_REQUIRED' | translate), control: form.controls['surname']
            }"></ng-container>
          </div>

          <div class="profile-field">
            <label for="profile-username">{{ 'USERNAME' | translate }}</label>
            <input id="profile-username" type="text" class="form-control" [placeholder]="'USERNAME' | translate"
              name="username" formControlName="username"
              [class.is-invalid]="form.controls['username'].invalid && (form.controls['username'].dirty || form.controls['username'].touched)" />
            <ng-container [ngTemplateOutlet]="formError" [ngTemplateOutletContext]="{
              validation: 'required', message: ('USERNAME' | translate) + ' ' + ('IS_REQUIRED' | translate), control: form.controls['username']
            }"></ng-container>
          </div>

          <div class="profile-field">
            <label for="profile-phone">{{ 'CONTRACT_PHONE' | translate }}</label>
            <input id="profile-phone" type="tel" class="form-control" [placeholder]="'CONTRACT_PHONE' | translate"
              name="phone" formControlName="phone"
              [class.is-invalid]="form.controls['phone'].invalid && (form.controls['phone'].dirty || form.controls['phone'].touched)" />
            <ng-container [ngTemplateOutlet]="formError" [ngTemplateOutletContext]="{
              validation: 'required', message: ('CONTRACT_PHONE' | translate) + ' ' + ('IS_REQUIRED' | translate), control: form.controls['phone']
            }"></ng-container>
          </div>

          <div class="profile-field">
            <label for="profile-country">{{ 'COUNTRY' | translate }} </label>
            <input id="profile-country" type="text" class="form-control" [placeholder]="'COUNTRY' | translate"
              name="country" formControlName="country"
              [class.is-invalid]="form.controls['country'].invalid && (form.controls['country'].dirty || form.controls['country'].touched)" />
            <ng-container [ngTemplateOutlet]="formError" [ngTemplateOutletContext]="{
              validation: 'required', message: ('COUNTRY' | translate) + ' ' + ('IS_REQUIRED' | translate), control: form.controls['country']
            }"></ng-container>
          </div>

          <div class="profile-field">
            <label for="profile-city">{{ 'CITY' | translate }} </label>
            <input id="profile-city" type="text" class="form-control" [placeholder]="'CITY' | translate"
              name="city" formControlName="city"
              [class.is-invalid]="form.controls['city'].invalid && (form.controls['city'].dirty || form.controls['city'].touched)" />
            <ng-container [ngTemplateOutlet]="formError" [ngTemplateOutletContext]="{
              validation: 'required', message: ('CITY' | translate) + ' ' + ('IS_REQUIRED' | translate), control: form.controls['city']
            }"></ng-container>
          </div>

          <div class="profile-field">
            <label for="profile-district">{{ 'DISTRICT' | translate }} </label>
            <input id="profile-district" type="text" class="form-control" [placeholder]="'DISTRICT' | translate"
              name="district" formControlName="district"
              [class.is-invalid]="form.controls['district'].invalid && (form.controls['district'].dirty || form.controls['district'].touched)" />
            <ng-container [ngTemplateOutlet]="formError" [ngTemplateOutletContext]="{
              validation: 'required', message: ('DISTRICT' | translate) + ' ' + ('IS_REQUIRED' | translate), control: form.controls['district']
            }"></ng-container>
          </div>

          <div class="profile-field profile-field-wide">
            <label for="profile-address">{{ 'FULL_ADDRESS' | translate }} </label>
            <textarea id="profile-address" class="form-control" name="address" formControlName="address" autocomplete="off"
              [placeholder]="'FULL_ADDRESS' | translate"
              [class.is-invalid]="form.controls['address'].invalid && (form.controls['address'].dirty || form.controls['address'].touched)"></textarea>
            <ng-container [ngTemplateOutlet]="formError" [ngTemplateOutletContext]="{
              validation: 'required', message: ('FULL_ADDRESS' | translate) + ' ' + ('IS_REQUIRED' | translate), control: form.controls['address']
            }"></ng-container>
          </div>
        </div>
      </div>

      <footer class="card-footer profile-card-footer">
        <button type="submit" class="btn btn-primary profile-save-button" [disabled]="form.invalid">
          {{ 'SAVE_CHANGES' | translate }}
        </button>
      </footer>
    </form>
  </div>

  <ng-template #formError let-control="control" let-message="message" let-validation="validation">
    <span *ngIf="control.hasError(validation) && (control.dirty || control.touched)" class="profile-field-error" role="alert">
      {{ message }}
    </span>
  </ng-template>
</section>
