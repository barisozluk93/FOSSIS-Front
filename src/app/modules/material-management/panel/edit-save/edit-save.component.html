<app-modal #modal [modalConfig]="modalConfig">
  <form class="form w-100" [formGroup]="form" novalidate="novalidate">

    <div class="fv-row mb-8">
      <label class="form-label fs-6 fw-bolder text-gray-900">{{'MANUFACTURER' | translate}}</label>
      <input class="form-control bg-transparent" type="text" name="manufacturer" formControlName="manufacturer"
        autocomplete="off" [ngClass]="{
                'is-invalid': form.controls['manufacturer'].invalid,
                'is-valid': form.controls['manufacturer'].valid
              }" />
      <ng-container [ngTemplateOutlet]="formError" [ngTemplateOutletContext]="{
                validation: 'required',
                message: ('MANUFACTURER' | translate) + ' ' + ('IS_REQUIRED' | translate),
                control: form.controls['manufacturer']
              }"></ng-container>
    </div>

    <div class="fv-row mb-8">
      <label class="form-label fs-6 fw-bolder text-gray-900">{{'MODEL' | translate}}</label>
      <input class="form-control bg-transparent" type="text" name="model" formControlName="model" autocomplete="off"
        [ngClass]="{
              'is-invalid': form.controls['model'].invalid,
              'is-valid': form.controls['model'].valid
            }" />
      <ng-container [ngTemplateOutlet]="formError" [ngTemplateOutletContext]="{
              validation: 'required',
              message: ('MODEL' | translate) + ' ' + ('IS_REQUIRED' | translate),
              control: form.controls['model']
            }"></ng-container>
    </div>

    <div class="fv-row mb-8">
      <label class="form-label fs-6 fw-bolder text-gray-900">{{'SERIES' | translate}}</label>
      <input class="form-control bg-transparent" type="text" name="series" formControlName="series" autocomplete="off"
        [ngClass]="{
          'is-invalid': form.controls['series'].invalid,
          'is-valid': form.controls['series'].valid
        }" />
      <ng-container [ngTemplateOutlet]="formError" [ngTemplateOutletContext]="{
          validation: 'required',
          message: ('SERIES' | translate) + ' ' + ('IS_REQUIRED' | translate),
          control: form.controls['series']
        }"></ng-container>
    </div>

    <div class="fv-row mb-8">
      <label class="form-label fs-6 fw-bolder text-gray-900">{{'TYPE' | translate}}</label>
      <input class="form-control bg-transparent" type="text" name="type" formControlName="type" autocomplete="off"
        [ngClass]="{
          'is-invalid': form.controls['type'].invalid,
          'is-valid': form.controls['type'].valid
        }" />
      <ng-container [ngTemplateOutlet]="formError" [ngTemplateOutletContext]="{
          validation: 'required',
          message: ('SERIES' | translate) + ' ' + ('IS_REQUIRED' | translate),
          control: form.controls['type']
        }"></ng-container>
    </div>

    <div class="fv-row mb-8">
      <label class="form-label fs-6 fw-bolder text-gray-900">{{'MAXIMUM_DC_POWER' | translate}}</label>
      <input class="form-control bg-transparent" type="number" name="maximumDCPower" formControlName="maximumDCPower" autocomplete="off"
        [ngClass]="{
          'is-invalid': form.controls['maximumDCPower'].invalid,
          'is-valid': form.controls['maximumDCPower'].valid
        }" />
      <ng-container [ngTemplateOutlet]="formError" [ngTemplateOutletContext]="{
          validation: 'required',
          message: ('MAXIMUM_DC_POWER' | translate) + ' ' + ('IS_REQUIRED' | translate),
          control: form.controls['maximumDCPower']
        }"></ng-container>
    </div>
  </form>

  <ng-template #formError let-control="control" let-message="message" let-validation="validation">
    <ng-container *ngIf="control.hasError(validation) && (control.dirty || control.touched)">
      <div class="fv-plugins-message-container">
        <span role="alert">
          {{ message }}
        </span>
      </div>
    </ng-container>
  </ng-template>
</app-modal>
