<app-confirmation #confirmationComponent (dismissButtonClick)="delete($event)">
</app-confirmation>

<map-project-editsave #editSaveComponent [map]="map" (isSuccess)="isSuccess($event)"></map-project-editsave>

<div id="project" *ngIf="projectVisibility">
    <div class="card">
        <div class="card-header px-0" style="min-height: 50px;">
            <h4 class="card-title align-items-start mt-4" style="margin-left: 2rem;">
                <a class="card-label fw-bolder fs-3">
                    <span [inlineSVG]="'./assets/media/icons/duotune/general/gen025.svg'" class="svg-icon svg-icon-3"
                        [ngClass]="'svg-icon-primary'"></span>
                    {{'MAP_PROJECTS' | translate}}
                </a>
            </h4>
            <div class="card-toolbar">
                <a (click)="closePanel()" class="btn btn-sm">
                    <span [inlineSVG]="'./assets/media/icons/duotune/arrows/arr015.svg'" class="svg-icon svg-icon-3"
                        [ngClass]="'svg-icon-primary'"></span>
                </a>
            </div>
        </div>
        <div class="card-body">
            <app-datatable [header]="tableName" [paginationModel]="paginationModel" [dataSource]="dataSource"
                [totalCount]="totalCount" [columnList]="columnList"
                (paginationModelChange)="paginationModelChange($event)" (newButtonClick)="openSaveModal($event)"
                (editButtonClick)="openEditModal($event)" (deleteButtonClick)="openDeleteModal($event)"
                class="card card-xxl-stretch mb-5 mb-xl-8" [hasEditPermission]="hasEditPermission"
                [hasDeletePermission]="hasDeletePermission"
                [hasNewRecordPermission]="hasNewRecordPermission"></app-datatable>
        </div>
    </div>
</div>
