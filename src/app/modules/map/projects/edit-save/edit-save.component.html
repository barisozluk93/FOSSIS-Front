<map-project-alert #alertComponent></map-project-alert>

<div id="projectEditSave" *ngIf="projectEditSaveVisibility">
    <div class="card">
        <div class="card-header px-0" style="min-height: 50px;">
            <h4 class="card-title align-items-start mt-4" style="margin-left: 2rem;">
                <a *ngIf="projectId == 0" class="card-label fw-bolder fs-3">
                    <span [inlineSVG]="'./assets/media/icons/duotune/arrows/arr075.svg'" class="svg-icon svg-icon-3"
                        [ngClass]="'svg-icon-primary'"></span>
                    {{'MAP_NEW_PROJECT' | translate}}
                </a>

                <a *ngIf="projectId > 0" class="card-label fw-bolder fs-3">
                    <span [inlineSVG]="'./assets/media/icons/duotune/art/art005.svg'" class="svg-icon svg-icon-3"
                        [ngClass]="'svg-icon-primary'"></span>
                    {{'MAP_EDIT_PROJECT' | translate}}
                </a>
            </h4>
            <div class="card-toolbar">
                <a (click)="closePanel()" class="btn btn-sm">
                    <span [inlineSVG]="'./assets/media/icons/duotune/arrows/arr015.svg'" class="svg-icon svg-icon-3"
                        [ngClass]="'svg-icon-primary'"></span>
                </a>
            </div>
        </div>
        <div class="card-body">
            <div class="card">
                <div class="card-header border-0 pt-5">
                    <div class="card-toolbar">
                        <ul class="nav">
                            <li class="nav-item">
                                <a class="
                                    nav-link
                                    btn btn-sm btn-color-muted btn-active btn-active-light-primary
                                    fw-bolder
                                    px-4
                                    me-1
                                " data-bs-toggle="tab" [ngClass]="activeDisabledClass('mainInfos')" (click)="setTab('mainInfos')">
                                    {{'MAP_PROJECT_MAIN_INFO' | translate}}
                                </a>
                            </li>
                            <li class="nav-item">
                                <a class="
                            nav-link
                            btn btn-sm btn-color-muted btn-active btn-active-light-primary
                            fw-bolder
                            px-4
                            me-1
                        " data-bs-toggle="tab" [ngClass]="activeDisabledClass('roofStyle')" (click)="setTab('roofStyle')">
                                    {{'MAP_PROJECT_ROOF_STYLE' | translate}}
                                </a>
                            </li>
                            <li class="nav-item">
                                <a class="
                            nav-link
                            btn btn-sm btn-color-muted btn-active btn-active-light-primary
                            fw-bolder
                            px-4
                            me-1
                        " data-bs-toggle="tab" [ngClass]="activeDisabledClass('planning')" (click)="setTab('planning')">
                                    {{'MAP_PROJECT_PLANNING' | translate}}
                                </a>
                            </li>
                        </ul>
                    </div>
                </div>
                <div class="card-body">
                    <div class="tab-content">
                        <div class="tab-pane fade" [ngClass]="activeDisabledClass('mainInfos')" id="mainInfos">
                            <app-main-infos #mainInfosComponent [map]="map" [project]="project" (isBuildingSelectionCompleted)="isBuildingSelectionCompleted($event)" (isCompleted)="isCompleted($event)"></app-main-infos>
                        </div>
                        <div class="tab-pane fade" [ngClass]="activeDisabledClass('roofStyle')" id="roofStyle">
                            <app-roof-style #roofStyleComponent [project]="project" (isRoofStylingStarted)="isRoofStylingStarted($event)" (isCompleted)="isCompleted($event)"></app-roof-style>
                        </div>
                        <div class="tab-pane fade" [ngClass]="activeDisabledClass('planning')" id="planning">

                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
