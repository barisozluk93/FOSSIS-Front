<form class="auth-form" [formGroup]="resetPasswordForm" (ngSubmit)="submit()" novalidate id="kt_login_password_reset_form">
  <div class="auth-form-heading"><h2>{{ 'RESET_PASSWORD' | translate }}</h2></div>
  <div *ngIf="errorState === errorStates.HasError" class="alert alert-danger" role="alert">{{ 'ERRORS_DETECTED_TRY_AGAIN' | translate }}</div>
  <div *ngIf="errorState === errorStates.NoError" class="alert alert-success" role="status">{{ 'AUTH_UI.RESET_SUCCESS' | translate }}</div>
  <div class="auth-field">
    <label for="reset-password">{{ 'PASSWORD' | translate }}</label>
    <input id="reset-password" class="form-control" type="password" name="password" formControlName="password" autocomplete="new-password" [class.is-invalid]="f.password.invalid && (f.password.dirty || f.password.touched)" />
    <ng-container [ngTemplateOutlet]="formError" [ngTemplateOutletContext]="{ control: f.password, validation: 'required', message: ('PASSWORD' | translate) + ' ' + ('IS_REQUIRED' | translate) }"></ng-container>
    <ng-container [ngTemplateOutlet]="formError" [ngTemplateOutletContext]="{ control: f.password, validation: 'minlength', message: ('PASSWORD_SHOULD_HAVE_AT_LEAST_3_SYMBOLS' | translate) }"></ng-container>
    <ng-container [ngTemplateOutlet]="formError" [ngTemplateOutletContext]="{ control: f.password, validation: 'maxlength', message: ('PASSWORD_SHOULD_HAVE_MAXIMUM_100_SYMBOLS' | translate) }"></ng-container>
  </div>
  <div class="auth-field">
    <label for="reset-confirm">{{ 'CONFIRM_PASSWORD' | translate }}</label>
    <input id="reset-confirm" class="form-control" type="password" name="cPassword" formControlName="cPassword" autocomplete="new-password" [class.is-invalid]="f.cPassword.invalid && (f.cPassword.dirty || f.cPassword.touched)" />
    <ng-container [ngTemplateOutlet]="formError" [ngTemplateOutletContext]="{ control: f.cPassword, validation: 'required', message: ('CONFIRM_PASSWORD' | translate) + ' ' + ('IS_REQUIRED' | translate) }"></ng-container>
    <ng-container [ngTemplateOutlet]="formError" [ngTemplateOutletContext]="{ control: f.cPassword, validation: 'minlength', message: ('CONFIRM_PASSWORD_SHOULD_HAVE_AT_LEAST_3_SYMBOLS' | translate) }"></ng-container>
    <ng-container [ngTemplateOutlet]="formError" [ngTemplateOutletContext]="{ control: f.cPassword, validation: 'maxlength', message: ('CONFIRM_PASSWORD_SHOULD_HAVE_MAXIMUM_100_SYMBOLS' | translate) }"></ng-container>
    <span *ngIf="f.cPassword.hasError('ConfirmPassword') && (f.cPassword.dirty || f.cPassword.touched)" class="auth-error" role="alert">{{ 'NOMATCH_PASSWORD' | translate }}</span>
  </div>
  <button type="submit" class="btn btn-primary auth-submit" id="kt_password_reset_submit" [disabled]="resetPasswordForm.invalid || (isLoading$ | async)">
    <span *ngIf="(isLoading$ | async) === false">{{ 'RESET_PASSWORD' | translate }}</span>
    <span *ngIf="isLoading$ | async">{{ 'PLEASE_WAIT' | translate }} <span class="spinner-border spinner-border-sm ms-2" aria-hidden="true"></span></span>
  </button>
  <p class="auth-form-switch"><a routerLink="/auth/login">← {{ 'AUTH_UI.BACK_LOGIN' | translate }}</a></p>
</form>
<ng-template #formError let-control="control" let-message="message" let-validation="validation"><span *ngIf="control.hasError(validation) && (control.dirty || control.touched)" class="auth-error" role="alert">{{ message }}</span></ng-template>
