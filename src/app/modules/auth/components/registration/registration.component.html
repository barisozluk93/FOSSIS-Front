<form class="auth-form" [formGroup]="registrationForm" (ngSubmit)="submit()" novalidate id="kt_login_signup_form">
  <div class="auth-form-heading"><h2>{{ 'SIGN_UP' | translate }}</h2></div>
  <div *ngIf="errorState === errorStates.HasError" class="alert alert-danger" role="alert">{{ 'REGISTRATION_DETAILS_INCORRECT' | translate }}</div>
  <div *ngIf="errorState === errorStates.NoError" class="alert alert-success" role="status">{{ 'REGISTRATION_SUCCESSFULLY_COMPLETED' | translate }}</div>

  <div class="auth-field-grid">
    <div class="auth-field"><label for="signup-name">{{ 'NAME' | translate }}</label><input id="signup-name" class="form-control" type="text" formControlName="name" name="name" autocomplete="given-name" [class.is-invalid]="f.name.invalid && (f.name.dirty || f.name.touched)" /><ng-container [ngTemplateOutlet]="formError" [ngTemplateOutletContext]="{ control: f.name, validation: 'required', message: ('NAME' | translate) + ' ' + ('IS_REQUIRED' | translate) }"></ng-container></div>
    <div class="auth-field"><label for="signup-surname">{{ 'LAST_NAME' | translate }}</label><input id="signup-surname" class="form-control" type="text" formControlName="surname" name="surname" autocomplete="family-name" [class.is-invalid]="f.surname.invalid && (f.surname.dirty || f.surname.touched)" /><ng-container [ngTemplateOutlet]="formError" [ngTemplateOutletContext]="{ control: f.surname, validation: 'required', message: ('LAST_NAME' | translate) + ' ' + ('IS_REQUIRED' | translate) }"></ng-container></div>
  </div>
  <div class="auth-field"><label for="signup-email">{{ 'EMAIL' | translate }}</label><input id="signup-email" class="form-control" type="email" formControlName="email" name="email" autocomplete="email" [class.is-invalid]="f.email.invalid && (f.email.dirty || f.email.touched)" /><ng-container [ngTemplateOutlet]="formError" [ngTemplateOutletContext]="{ control: f.email, validation: 'required', message: ('EMAIL' | translate) + ' ' + ('IS_REQUIRED' | translate) }"></ng-container><ng-container [ngTemplateOutlet]="formError" [ngTemplateOutletContext]="{ control: f.email, validation: 'email', message: ('EMAIL_IS_INVALID' | translate) }"></ng-container><ng-container [ngTemplateOutlet]="formError" [ngTemplateOutletContext]="{ control: f.email, validation: 'minlength', message: ('EMAIL_SHOULD_HAVE_AT_LEAST_3_SYMBOLS' | translate) }"></ng-container><ng-container [ngTemplateOutlet]="formError" [ngTemplateOutletContext]="{ control: f.email, validation: 'maxlength', message: ('EMAIL_SHOULD_HAVE_MAXIMUM_360_SYMBOLS' | translate) }"></ng-container></div>
  <div class="auth-field-grid">
    <div class="auth-field"><label for="signup-username">{{ 'USERNAME' | translate }}</label><input id="signup-username" class="form-control" type="text" formControlName="username" name="username" autocomplete="username" [class.is-invalid]="f.username.invalid && (f.username.dirty || f.username.touched)" /><ng-container [ngTemplateOutlet]="formError" [ngTemplateOutletContext]="{ control: f.username, validation: 'required', message: ('USERNAME' | translate) + ' ' + ('IS_REQUIRED' | translate) }"></ng-container></div>
    <div class="auth-field"><label for="signup-phone">{{ 'PHONE' | translate }}</label><input id="signup-phone" class="form-control" type="tel" formControlName="phone" name="phone" autocomplete="tel" [class.is-invalid]="f.phone.invalid && (f.phone.dirty || f.phone.touched)" /><ng-container [ngTemplateOutlet]="formError" [ngTemplateOutletContext]="{ control: f.phone, validation: 'required', message: ('PHONE' | translate) + ' ' + ('IS_REQUIRED' | translate) }"></ng-container></div>
  </div>
  <div class="auth-field-grid">
    <div class="auth-field"><label for="signup-password">{{ 'PASSWORD' | translate }}</label><input id="signup-password" class="form-control" type="password" formControlName="password" name="password" autocomplete="new-password" [class.is-invalid]="f.password.invalid && (f.password.dirty || f.password.touched)" /><ng-container [ngTemplateOutlet]="formError" [ngTemplateOutletContext]="{ control: f.password, validation: 'required', message: ('PASSWORD' | translate) + ' ' + ('IS_REQUIRED' | translate) }"></ng-container><ng-container [ngTemplateOutlet]="formError" [ngTemplateOutletContext]="{ control: f.password, validation: 'minlength', message: ('PASSWORD_SHOULD_HAVE_AT_LEAST_3_SYMBOLS' | translate) }"></ng-container><ng-container [ngTemplateOutlet]="formError" [ngTemplateOutletContext]="{ control: f.password, validation: 'maxlength', message: ('PASSWORD_SHOULD_HAVE_MAXIMUM_100_SYMBOLS' | translate) }"></ng-container></div>
    <div class="auth-field"><label for="signup-confirm">{{ 'CONFIRM_PASSWORD' | translate }}</label><input id="signup-confirm" class="form-control" type="password" formControlName="cPassword" name="cPassword" autocomplete="new-password" [class.is-invalid]="f.cPassword.invalid && (f.cPassword.dirty || f.cPassword.touched)" /><ng-container [ngTemplateOutlet]="formError" [ngTemplateOutletContext]="{ control: f.cPassword, validation: 'required', message: ('CONFIRM_PASSWORD' | translate) + ' ' + ('IS_REQUIRED' | translate) }"></ng-container><ng-container [ngTemplateOutlet]="formError" [ngTemplateOutletContext]="{ control: f.cPassword, validation: 'minlength', message: ('CONFIRM_PASSWORD_SHOULD_HAVE_AT_LEAST_3_SYMBOLS' | translate) }"></ng-container><ng-container [ngTemplateOutlet]="formError" [ngTemplateOutletContext]="{ control: f.cPassword, validation: 'maxlength', message: ('CONFIRM_PASSWORD_SHOULD_HAVE_MAXIMUM_100_SYMBOLS' | translate) }"></ng-container><span *ngIf="f.cPassword.hasError('ConfirmPassword') && (f.cPassword.dirty || f.cPassword.touched)" class="auth-error" role="alert">{{ 'NOMATCH_PASSWORD' | translate }}</span></div>
  </div>
  <button type="submit" class="btn btn-primary auth-submit" id="kt_sign_up_submit" [disabled]="registrationForm.invalid || (isLoading$ | async)"><span *ngIf="(isLoading$ | async) === false">{{ 'SIGN_UP' | translate }}</span><span *ngIf="isLoading$ | async">{{ 'PLEASE_WAIT' | translate }} <span class="spinner-border spinner-border-sm ms-2" aria-hidden="true"></span></span></button>
  <p class="auth-form-switch">{{ 'ALREADY_HAVE_AN_ACCOUNT' | translate }} <a routerLink="/auth/login">{{ 'LOG_IN' | translate }}</a></p>
</form>
<ng-template #formError let-control="control" let-message="message" let-validation="validation"><span *ngIf="control.hasError(validation) && (control.dirty || control.touched)" class="auth-error" role="alert">{{ message }}</span></ng-template>
