<form class="auth-form" [formGroup]="loginForm" (ngSubmit)="submit()" novalidate id="kt_login_signin_form">
  <div class="auth-form-heading"><h2>{{ 'LOG_IN' | translate }}</h2></div>
  <div *ngIf="hasError" class="alert alert-danger" role="alert">{{ 'LOGIN_DETAILS_INCORRECT' | translate }}</div>

  <div class="auth-field">
    <label for="login-email">{{ 'EMAIL' | translate }}</label>
    <input id="login-email" class="form-control" type="email" name="email" formControlName="email" autocomplete="email" [class.is-invalid]="f.email.invalid && (f.email.dirty || f.email.touched)" />
    <ng-container [ngTemplateOutlet]="formError" [ngTemplateOutletContext]="{ control: f.email, validation: 'required', message: ('EMAIL' | translate) + ' ' + ('IS_REQUIRED' | translate) }"></ng-container>
    <ng-container [ngTemplateOutlet]="formError" [ngTemplateOutletContext]="{ control: f.email, validation: 'email', message: ('EMAIL_IS_INVALID' | translate) }"></ng-container>
    <ng-container [ngTemplateOutlet]="formError" [ngTemplateOutletContext]="{ control: f.email, validation: 'minlength', message: ('EMAIL_SHOULD_HAVE_AT_LEAST_3_SYMBOLS' | translate) }"></ng-container>
    <ng-container [ngTemplateOutlet]="formError" [ngTemplateOutletContext]="{ control: f.email, validation: 'maxlength', message: ('EMAIL_SHOULD_HAVE_MAXIMUM_360_SYMBOLS' | translate) }"></ng-container>
  </div>
  <div class="auth-field">
    <div class="auth-label-row"><label for="login-password">{{ 'PASSWORD' | translate }}</label><a routerLink="/auth/forgot-password">{{ 'FORGOT_PASSWORD' | translate }}</a></div>
    <input id="login-password" class="form-control" type="password" name="password" formControlName="password" autocomplete="current-password" [class.is-invalid]="f.password.invalid && (f.password.dirty || f.password.touched)" />
    <ng-container [ngTemplateOutlet]="formError" [ngTemplateOutletContext]="{ control: f.password, validation: 'required', message: ('PASSWORD' | translate) + ' ' + ('IS_REQUIRED' | translate) }"></ng-container>
    <ng-container [ngTemplateOutlet]="formError" [ngTemplateOutletContext]="{ control: f.password, validation: 'minlength', message: ('PASSWORD_SHOULD_HAVE_AT_LEAST_3_SYMBOLS' | translate) }"></ng-container>
    <ng-container [ngTemplateOutlet]="formError" [ngTemplateOutletContext]="{ control: f.password, validation: 'maxlength', message: ('PASSWORD_SHOULD_HAVE_MAXIMUM_100_SYMBOLS' | translate) }"></ng-container>
  </div>
  <button type="submit" class="btn btn-primary auth-submit" id="kt_sign_in_submit" [disabled]="loginForm.invalid || (isLoading$ | async)">
    <span *ngIf="(isLoading$ | async) === false">{{ 'LOG_IN' | translate }} <span aria-hidden="true">↗</span></span>
    <span *ngIf="isLoading$ | async">{{ 'PLEASE_WAIT' | translate }} <span class="spinner-border spinner-border-sm ms-2" aria-hidden="true"></span></span>
  </button>
  <p class="auth-form-switch">{{ 'NOT_A_MEMBER_YET' | translate }} <a routerLink="/auth/registration">{{ 'SIGN_UP' | translate }}</a></p>
</form>
<ng-template #formError let-control="control" let-message="message" let-validation="validation"><span *ngIf="control.hasError(validation) && (control.dirty || control.touched)" class="auth-error" role="alert">{{ message }}</span></ng-template>
