<!-- begin::Theme mode -->
<app-theme-mode-switcher class="d-flex align-items-center me-3"
  toggleBtnClass="btn btn-icon btn-primary w-40px h-40px pulse pulse-white">
</app-theme-mode-switcher>
<!-- end::Theme mode -->
 
<!--begin::User-->
<div *ngIf="isCurrentUserExist" class="d-flex align-items-center me-3" id="kt_header_user_menu_toggle">
  <!--begin::Menu wrapper-->
  <div class="cursor-pointer symbol symbol-40px" data-kt-menu-trigger="click" (click)="toggleHeaderMenu($event)" data-kt-menu-overflow="true"
    data-kt-menu-placement="top-start" title="{{'USER_PROFILE' | translate}}">
    <img *ngIf="user?.fileId == undefined" src="./assets/media/avatars/blank.png" />
    <img *ngIf="user?.fileId != undefined" [src]="user?.fileResult?.fileContents" alt="image" />
  </div>
  <!--end::Menu wrapper-->
  <app-user-inner></app-user-inner>
</div>
<!--end::User-->
