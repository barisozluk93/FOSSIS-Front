<div [ngClass]="headerContainerCssClasses" class="app-header-inner" id="kt_header_container">
  <a routerLink="/dashboard" class="app-brand" aria-label="Fossis ana sayfa">
    <img alt="FOSSIS 3" src="./assets/media/logos/favicon.png" class="app-brand-logo" />
  </a>

  <button type="button" class="app-mobile-menu-toggle" (click)="toggleMobileMenu()"
    [attr.aria-expanded]="mobileMenuOpen" aria-controls="app-primary-navigation" [attr.aria-label]="'NAV_MENU' | translate">
    <span></span><span></span><span></span>
  </button>

  <div class="app-header-navigation" id="app-primary-navigation" [class.is-open]="mobileMenuOpen">
    <app-header-menu></app-header-menu>
  </div>

  <app-topbar class="app-header-actions"></app-topbar>
</div>
