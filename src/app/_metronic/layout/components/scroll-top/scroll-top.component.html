<button
  type="button"
  class="scroll-to-top"
  [class.show-scroll-top]="windowScrolled"
  [attr.aria-hidden]="!windowScrolled"
  [attr.tabindex]="windowScrolled ? 0 : -1"
  [attr.aria-label]="'LANDING.BACK_TOP' | translate"
  [attr.title]="'LANDING.BACK_TOP' | translate"
  (click)="scrollToTop()">
  <span aria-hidden="true">↑</span>
</button>
